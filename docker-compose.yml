services:
  database:
    image: postgres:15-alpine
    container_name: cdss_db
    restart: always

    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    env_file:
      - .env  
    ports:
      - "5432:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]  
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  backend:
    build: 
      context: ./backend
    container_name: cdss
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:1234@database:5432/cdss_db
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy  
volumes:
  postgres_data:        
